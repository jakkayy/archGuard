name: ArchGuard Automated Release (CD)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries for Cross Platforms
        run: |
          mkdir -p dist
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o dist/archguard-linux-amd64 ./cmd/archguard
          tar -czvf dist/archguard-linux-amd64.tar.gz -C dist archguard-linux-amd64

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o dist/archguard-linux-arm64 ./cmd/archguard
          tar -czvf dist/archguard-linux-arm64.tar.gz -C dist archguard-linux-arm64

          # macOS amd64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -o dist/archguard-darwin-amd64 ./cmd/archguard
          tar -czvf dist/archguard-darwin-amd64.tar.gz -C dist archguard-darwin-amd64

          # macOS arm64 (Apple Silicon M1/M2/M3)
          GOOS=darwin GOARCH=arm64 go build -o dist/archguard-darwin-arm64 ./cmd/archguard
          tar -czvf dist/archguard-darwin-arm64.tar.gz -C dist archguard-darwin-arm64

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o dist/archguard-windows-amd64.exe ./cmd/archguard
          zip -j dist/archguard-windows-amd64.zip dist/archguard-windows-amd64.exe

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/archguard-linux-amd64.tar.gz
            dist/archguard-linux-arm64.tar.gz
            dist/archguard-darwin-amd64.tar.gz
            dist/archguard-darwin-arm64.tar.gz
            dist/archguard-windows-amd64.zip
          generate_release_notes: true
