name: ArchGuard Automated Release (CD)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver only, so moving the major tag (v1) does not re-release
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # pre-releases, e.g. v1.1.0-rc.1

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
