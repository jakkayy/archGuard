name: ArchGuard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-scan:
    name: Test & Quality Inspection
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Go Code Formatting & Vet
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: Run Unit Tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce Coverage Threshold (80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "### Test coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit (t < 80) }' || { echo "Coverage ${total}% is below 80%"; exit 1; }

      - name: Build ArchGuard Executable Binary
        run: go build -o bin/archguard ./cmd/archguard

      - name: Self-Scan with ArchGuard (Dogfooding)
        run: ./bin/archguard scan

      - name: Generate SARIF Security & Policy Report
        run: ./bin/archguard scan --format=sarif > archguard-results.sarif
        continue-on-error: true

      - name: Upload SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: archguard-results.sarif
