version: "v1"

# ----------------------------------------------------
# 📂 Ignore Paths (ข้ามไฟล์/โฟลเดอร์ที่ไม่ต้องการตรวจ)
# ----------------------------------------------------
# ignore:
#   - "tmp"
#   - "*.gen.go"

# ----------------------------------------------------
# 🛡️ Engineering Policies Rules
# ----------------------------------------------------
rules:
  # 1. File Naming Policy
  file-naming:
    enabled: true
    severity: WARNING
    pattern: "^[a-zA-Z0-9._-]+$"

  # 2. No Hardcoded Secrets Check
  no-secrets:
    enabled: true
    severity: ERROR
    exclude:
      - "pkg/rule/no_secrets_test.go" # fixtures that must look like real secrets

  # 3. Mandatory Files Check
  required-files:
    enabled: true
    severity: ERROR
    files:
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - ".gitignore"

  # 4. OpenAPI Spec Policy (ArchGuard is a CLI, not a REST API, so this stays off)
  openapi-exists:
    enabled: false
    severity: ERROR
    path: "docs/openapi.json"
